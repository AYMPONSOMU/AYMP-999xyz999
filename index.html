<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AYMP Cosmic Kingdom</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #scene {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            padding-bottom: 40px;
            box-sizing: border-box;
        }
        #title { font-size: 24px; margin: 5px 0; }
        #subtitle { font-size: 16px; margin: 5px 0 15px 0; color: #ccc; }
        
        .btn-container {
            display: flex;
            gap: 15px;
            z-index: 1000;
        }
        .nav-btn {
            padding: 10px 25px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            color: white;
        }
        #nextBtn { background: #007bff; }
        #backBtn { background: #6c757d; display: none; }
        
        #cornerLogo{
            position:fixed; right:15px; bottom:15px; width:90px; height:auto; z-index:10000; opacity:0.95;
            animation: floatLogo 3s ease-in-out infinite, glow 2s ease-in-out infinite;
        }
        @keyframes floatLogo{ 0%{ transform:translateY(0px); } 50%{ transform:translateY(-8px); } 100%{ transform:translateY(0px); } }
        @keyframes glow{ 0%{ filter:drop-shadow(0 0 5px gold); } 50%{ filter:drop-shadow(0 0 20px gold); } 100%{ filter:drop-shadow(0 0 5px gold); } }

        .modal-content::-webkit-scrollbar { width: 6px; }
        .modal-content::-webkit-scrollbar-thumb { background-color: #f0a500; border-radius: 4px; }
        
        #langSelect {
            background: #222; color: #fff; border: 1px solid #f0a500; padding: 6px; border-radius: 6px; outline: none; cursor: pointer; margin-right: 35px;
        }

        .close-x-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 24px;
            font-weight: bold;
            color: #f0a500;
            background: none;
            border: none;
            cursor: pointer;
            line-height: 1;
            padding: 0;
            z-index: 100002;
        }
        .close-x-btn:hover { color: #fff; }
    </style>
</head>
<body>

    <div id="startScreen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:black; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:9999;">
        <h1 style="color:white; margin-bottom:20px;">AYMP Cosmic Kingdom</h1>
        <button id="entryBtn" style="padding:15px 30px; font-size:18px; cursor:pointer; background:#f0a500; border:none; border-radius:5px; font-weight:bold; color:black;">Enter Realm</button>
        <div style="margin-top:20px; padding:12px; background:rgba(255,215,0,0.15); border:1px solid gold; border-radius:10px; color:white; text-align:center; max-width:280px; font-size:14px;">
            👑 Touch the AYMP Emblem to view Game Guide, Tokenomics, Rewards, and Global Roadmap.
        </div>
        <img id="cornerLogo" src="images/favicon.png" alt="AYMP Logo">
    </div>

    <div id="scene">
        <div id="tokenBar" style="position:absolute; top:10px; left:10px; right:10px; display:flex; justify-content:space-between; align-items:center; z-index:1000;">
            <div style="background:rgba(0,0,0,0.6); padding:8px; border-radius:10px;">
                <img src="images/999xyz999.png" width="30" alt="XYZ">
                <span id="xyzBalance">100 XYZ</span>
            </div>
            <div style="background:rgba(0,0,0,0.6); padding:8px; border-radius:10px;">
                <img src="images/favicon.png" width="30" alt="AYMP">
                <span id="aympBalance">0 AYMP</span>
            </div>
        </div>
        
        <h1 id="title">Loading...</h1>
        <p id="subtitle">Please wait</p>
        
        <div id="zodiacPanel" style="display:none; text-align:center;">
            <select id="zodiacSelect">
                <option value="">Choose Zodiac</option>
                <option>Aries</option><option>Taurus</option><option>Gemini</option><option>Cancer</option>
                <option>Leo</option><option>Virgo</option><option>Libra</option><option>Scorpio</option>
                <option>Sagittarius</option><option>Capricorn</option><option>Aquarius</option><option>Pisces</option>
            </select>
            <br><br>
            <input id="playerName" type="text" placeholder="Enter Your Name" style="padding:10px;border-radius:8px;border:none;">
            <br><br>
            <button id="destinyBtn">Reveal Destiny</button>
            <p id="destinyResult"></p>
            <img id="powerArtImage" src="" style="display:none; width:180px; margin-top:15px; border-radius:12px;">
        </div>

        <div class="btn-container">
            <button id="backBtn" class="nav-btn">Back</button>
            <button id="nextBtn" class="nav-btn">Next</button>
        </div>
    </div>
    
    </body>
</html>
