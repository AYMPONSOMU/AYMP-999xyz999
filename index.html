<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AYMP Cosmic Kingdom</title>
    <style>
        body { background-color: #0b0c10; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: #1f2833; padding: 20px; border-radius: 15px; border: 2px solid #f0a500; box-shadow: 0 0 15px rgba(240,165,0,0.2); }
        .scene-box { min-height: 300px; padding: 10px; }
        .points-box { background: #000; color: #f0a500; padding: 10px; border-radius: 8px; font-weight: bold; margin-bottom: 15px; font-size: 18px; border: 1px solid #f0a500; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #45f3ff; background: #0b0c10; color: #fff; box-sizing: border-box; font-size: 15px; }
        button { background: #f0a500; color: #000; font-weight: bold; border: none; cursor: pointer; transition: 0.3s; }
        button:hover { background: #fff; color: #000; }
        .nav-btn { width: 48%; display: inline-block; background: #45f3ff; color: #000; }
        .remedy-box { background: rgba(40,167,69,0.1); border-left: 4px solid #28a745; padding: 12px; margin-top: 10px; border-radius: 5px; }
        .numbers-box { background: rgba(240,165,0,0.1); border-left: 4px solid #f0a500; padding: 10px; margin-top: 10px; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div id="pointsDisplay" class="points-box">Cosmic Points: 0</div>

    <div id="scene" class="scene-box">
        <h2 id="title">AYMP Cosmic Kingdom</h2>
        <p id="subtitle">Premium Web3 Astro-Strategic Hub</p>

        <div id="introPanel">
            <button onclick="connectWallet()">🌐 Connect MetaMask Wallet</button>
            <button onclick="claimDailyReward()">🎁 Claim Daily Reward</button>
            <button onclick="claimReferralReward()">👥 Claim Referral Bonus</button>
        </div>

        <div id="zodiacPanel" style="display: none; text-align: left; margin-top: 20px;">
            <label>Name / பெயர்:</label>
            <input type="text" id="playerName" placeholder="Enter your name">

            <label>Zodiac / ராசி:</label>
            <select id="zodiacSelect">
                <option value="">-- Select Zodiac --</option>
                <option value="mesh">Aries / மேஷம்</option>
                <option value="rishabh">Taurus / ரிஷபம்</option>
                <option value="mitun">Gemini / மிதுனம்</option>
            </select>

            <label>Nakshatra / நட்சத்திரம்:</label>
            <select id="nakshatraSelect">
                <option value="">-- Select Nakshatra --</option>
                <option value="aswini">Aswini / அஸ்வினி</option>
                <option value="bharani">Bharani / பரணி</option>
                <option value="krithika">Krittika / கார்த்திகை</option>
            </select>

            <label>Birth Date / பிறந்த தேதி:</label>
            <input type="date" id="playerDOB">

            <label>Birth Time / பிறந்த நேரம்:</label>
            <input type="time" id="playerTOB">

            <button id="destinyBtn">🔮 Reveal Destiny (Costs Points)</button>
        </div>

        <div id="destinyResult" style="margin-top: 15px;"></div>

        <img id="powerArtImage" src="" style="display:none; width:100%; max-width:250px; margin:20px auto; border-radius:10px;" alt="Sacred Yantra">
    </div>

    <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">
    
    <div style="display: flex; justify-content: space-between;">
        <button id="backBtn" class="nav-btn" style="display: none;">◀ Back</button>
        <button id="nextBtn" class="nav-btn">Next ▶</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
