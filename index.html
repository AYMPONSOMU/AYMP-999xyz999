<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AYMP Cosmic Kingdom</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #scene {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            padding-bottom: 40px;
            box-sizing: border-box;
        }
        #title {
            font-size: 24px;
            margin: 5px 0;
        }
        #subtitle {
            font-size: 16px;
            margin: 5px 0 15px 0;
            color: #ccc;
        }
        #nextBtn {
            padding: 10px 25px;
            font-size: 16px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="startScreen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:black; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:9999;">
        <h1 style="color:white; margin-bottom:20px;">AYMP Cosmic Kingdom</h1>
        <button id="entryBtn" style="padding:15px 30px; font-size:18px; cursor:pointer; background:#f0a500; border:none; border-radius:5px; font-weight:bold; color:black;">Enter Realm</button>
    </div>

    <div id="scene">
        <h1 id="title">Loading...</h1>
        <p id="subtitle">Please wait</p>
        <div id="zodiacPanel" style="display:none; text-align:center;">

<select id="zodiacSelect">
<option value="">Choose Zodiac</option>
<option>Aries</option>
<option>Taurus</option>
<option>Gemini</option>
<option>Cancer</option>
<option>Leo</option>
<option>Virgo</option>
<option>Libra</option>
<option>Scorpio</option>
<option>Sagittarius</option>
<option>Capricorn</option>
<option>Aquarius</option>
<option>Pisces</option>
</select>

<br><br>

<input
id="playerName"
type="text"
placeholder="Enter Your Name"
style="padding:10px;border-radius:8px;border:none;"
>

<br><br>

<button id="destinyBtn">
Reveal Destiny
</button>

<p id="destinyResult"></p>
            <img
id="powerArtImage"
src=""
style="
display:none;
width:180px;
margin-top:15px;
border-radius:12px;
">
<img
id="powerArtImage"
src=""
style="
display:none;
width:180px;
margin-top:15px;
border-radius:12px;
">
        </div>
        <button id="nextBtn">Next</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
